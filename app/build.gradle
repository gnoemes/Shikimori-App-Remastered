task generateChangelog {
    doLast {
        def tagOut = new ByteArrayOutputStream()
        project.exec {
            workingDir = rootProject.rootDir
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = tagOut
            ignoreExitValue = true
        }
        def lastTag = tagOut.toString().trim()

        def logOut = new ByteArrayOutputStream()
        if (lastTag) {
            project.exec {
                workingDir = rootProject.rootDir
                commandLine 'git', 'log', '--oneline', '--no-decorate', "${lastTag}..HEAD"
                standardOutput = logOut
            }
        } else {
            project.exec {
                workingDir = rootProject.rootDir
                commandLine 'git', 'log', '--oneline', '--no-decorate'
                standardOutput = logOut
            }
        }

        def date = new Date().format('yyyy-MM-dd')
        def title = lastTag ? "## ${lastTag.replaceAll('^v', '')} (${date})" : "## Initial (${date})"
        def changelog = "# Changelog\n\n${title}\n${logOut.toString().trim()}\n"

        file("${rootDir}/CHANGELOG.md").text = changelog
    }
}

