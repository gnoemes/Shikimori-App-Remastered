def getVersionName() {
    try {
        def proc = "git describe --tags --abbrev=0".execute()
        proc.waitFor()
        def tag = proc.text?.trim()
        return tag ? tag.replaceAll('^v', '') : '0.0.0'
    } catch (Exception e) {
        return '0.0.0'
    }
}

def getVersionCode() {
    try {
        def proc = "git rev-list --count HEAD".execute()
        proc.waitFor()
        def count = proc.text?.trim()
        return count ? count.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

android {
    namespace = 'com.gnoemes.shikimori'
    compileSdk versions.compileSdk

    defaultConfig {
        applicationId "com.gnoemes.shikimori"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode this.getVersionCode()
        versionName this.getVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix "-SNAPSHOT"
        }
    }

    buildTypes.configureEach {
        buildConfigField 'String', 'ShikimoriClientId', ShikimoriClientId
        buildConfigField 'String', 'ShikimoriClientSecret', ShikimoriClientSecret
        buildConfigField 'String', 'ShikimoriBaseUrl', ShikimoriBaseUrl
        buildConfigField 'String', 'VideoBaseUrl', VideoBaseUrl
        buildConfigField 'String', 'VkRandomToken', VkRandomToken
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            freeCompilerArgs.add("-Xannotation-default-target=param-property")
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/atomicfu.kotlin_module'
        }
    }
}

kapt {
    correctErrorTypes = true
    arguments {
        arg("defaultMoxyStrategy", "moxy.viewstate.strategy.AddToEndSingleStrategy")
        arg("disableEmptyStrategyCheck", "true")
